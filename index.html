<script>

$=s=>document.querySelector(s),

function toast(m,keep){const t=$('#toast');clearTimeout(tt);t.textContent=m||'';t.hidden=!m;if(m&&!keep)tt=setTimeout(()=>t.hidden=true,3500)}
function setMode(m){mode=m;$('#tIn').classList.toggle('on',m==='in');$('#tUp').classList.toggle('on',m==='up');$('#go').textContent=m==='in'?'Login':'Account banayein';$('#p').autocomplete=m==='in'?'current-password':'new-password';$('#er').textContent=''}

async function auth(){
  if(busy)return;const u=$('#u').value.trim().toLowerCase().replace(/^@/,''),p=$('#p').value,er=m=>{$('#er').textContent=m};
  if(!/^[a-z0-9_]{3,20}$/.test(u))return er('Username 3-20 characters ka ho: a-z, 0-9, _');
  if(p.length<6)return er('Password kam az kam 6 characters ka ho');

  try{
    const email=u+'@zchat.app';let r;
    if(mode==='up'){
      r=await sb.auth.signUp({email,password:p,options:{data:{username:u}}});
      if(r.error){er(/database|already|registered/i.test(r.error.message)?'Ye username pehle se maujood hai':r.error.message);return}
      if(!r.data.session)r=await sb.auth.signInWithPassword({email,password:p});
    }else r=await sb.auth.signInWithPassword({email,password:p});
    if(r.error){er(/confirm/i.test(r.error.message)?'Supabase mein Confirm email OFF karein':/invalid/i.test(r.error.message)?'Username ya password ghalat hai':r.error.message);return}
    await enter(r.data.user);
  }catch(e){er('Masla aaya, internet check karein')}

}
async function enter(user){
  const{data:pr}=await sb.from('profiles').select('id,username').eq('id',user.id).maybeSingle();
  if(!pr){await sb.auth.signOut();$('#boot').hidden=true;$('#auth').hidden=false;return toast('Profile nahi mili, dobara sign up karein')}

  await loadConvs();
  msgCh=sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},e=>onMsg(e.new)).subscribe();
  callCh=sb.channel('call:'+me.id).on('broadcast',{event:'sig'},e=>onSig(e.payload)).subscribe();
}
async function logout(){
  endCall(false);try{await sb.removeAllChannels()}catch(e){}outCh={};await sb.auth.signOut();
  me=peer=null;people={};convs={};seen=new Set();$('#msgs').replaceChildren();$('#chat').hidden=true;$('#empty').hidden=false;
  $('#app').classList.remove('open');$('#app').hidden=true;$('#auth').hidden=false;$('#p').value='';document.title='ZCHAT';
}
async function loadConvs(){
  const[c,m]=await Promise.all([sb.from('contacts').select('peer').eq('owner',me.id),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(300)]);
  const ids=new Set((c.data||[]).map(x=>x.peer));convs={};
  (m.data||[]).forEach(x=>{const o=x.sender===me.id?x.receiver:x.sender;ids.add(o);const v=convs[o]||(convs[o]={un:0});if(!v.last)v.last=x;if(x.receiver===me.id&&!x.read_at)v.un++});
  const need=[...ids].filter(i=>!people[i]);
  if(need.length){const{data}=await sb.from('profiles').select('id,username').in('id',need);(data||[]).forEach(p=>people[p.id]=p.username)}
  ids.forEach(i=>{if(!convs[i])convs[i]={un:0}});renderList();updTitle();
}
function renderList(){
  const L=$('#list');L.replaceChildren();const ids=Object.keys(convs).filter(i=>people[i]);
  if(!ids.length){L.append(el('div','hint','Abhi koi chat nahi. Upar username likh kar add karein.'));return}
  const t=i=>convs[i].last?new Date(convs[i].last.created_at).getTime():0;
  ids.sort((a,b)=>t(b)-t(a)).forEach(i=>{
    const v=convs[i],n=people[i],r=el('div','row'+(peer&&peer.id===i?' act':'')),av=el('div','av',n[0].toUpperCase()),w=el('div','rw');
    av.style.background='hsl('+hue(n)+',55%,42%)';w.append(el('div','nm','@'+n),el('div','lp',v.last?prev(v.last):''));r.append(av,w);
    if(v.un)r.append(el('div','bdg',v.un));r.onclick=()=>openChat(i);L.append(r)});
}
async function addUser(){
  const u=$('#addIn').value.trim().toLowerCase().replace(/^@/,'');if(!u)return;
  if(u===me.username)return toast('Apne aap ko add nahi kar sakte');
  try{
    const{data:p}=await sb.from('profiles').select('id,username').eq('username',u).maybeSingle();
    if(!p)return toast('Ye username nahi mila');
    people[p.id]=p.username;
    const{error}=await sb.from('contacts').upsert({owner:me.id,peer:p.id},{onConflict:'owner,peer',ignoreDuplicates:true});
    if(error)throw error;
    if(!convs[p.id])convs[p.id]={un:0};$('#addIn').value='';renderList();openChat(p.id);
  }catch(e){toast('Add nahi ho saka, dobara try karein')}
}
async function openChat(id){
  peer={id,username:people[id]};seen=new Set();$('#msgs').replaceChildren();$('#empty').hidden=true;$('#chat').hidden=false;
  $('#app').classList.add('open');$('#peerName').textContent='@'+peer.username;renderList();
  const{data}=await sb.from('messages').select('*').or('and(sender.eq.'+me.id+',receiver.eq.'+id+'),and(sender.eq.'+id+',receiver.eq.'+me.id+')').order('created_at',{ascending:false}).limit(100);
  if(!peer||peer.id!==id)return;
  (data||[]).reverse().forEach(addMsg);scrollEnd();markRead(id);
}
const scrollEnd=()=>{const m=$('#msgs');m.scrollTop=m.scrollHeight};
async function markRead(id){
  const v=convs[id];if(v&&v.un){v.un=0;renderList();updTitle()}
  try{await sb.from('messages').update({read_at:new Date().toISOString()}).eq('sender',id).eq('receiver',me.id).is('read_at',null)}catch(e){}
}
function addMsg(m){
  if(seen.has(m.id))return;seen.add(m.id);const b=el('div','b '+(m.sender===me.id?'o':'i')),s=()=>{if(near)scrollEnd()},near=true;
  if(m.kind==='text')b.textContent=m.body;
  else if(m.kind==='image'){const i=el('img');i.src=m.media_url;i.alt='photo';i.onload=()=>{const x=$('#msgs');if(x.scrollHeight-x.scrollTop-x.clientHeight<400)scrollEnd()};b.append(i)}
  else{const v=el(m.kind==='video'?'video':'audio');v.src=m.media_url;v.controls=true;v.preload='metadata';if(m.kind==='video')v.playsInline=true;b.append(v)}
  b.append(el('span','tm',new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})));$('#msgs').append(b);
}
function onMsg(m){
  if(m.sender!==me.id&&m.receiver!==me.id)return;
  const o=m.sender===me.id?m.receiver:m.sender,inc=m.receiver===me.id,v=convs[o]||(convs[o]={un:0}),open=peer&&peer.id===o;v.last=m;
  if(open){const x=$('#msgs'),near=x.scrollHeight-x.scrollTop-x.clientHeight<150;addMsg(m);if(near||!inc)scrollEnd();if(inc){if(document.hidden)v.un++;else markRead(o)}}
  else if(inc)v.un++;
  if(inc&&(document.hidden||!open))notify('@'+(people[o]||'Naya message'),prev(m));
  if(!people[o])loadConvs();else{renderList();updTitle()}
}
async function send(row,to=peer){
  if(!to)return;const{data,error}=await sb.from('messages').insert({receiver:to.id,...row}).select().single();if(error)throw error;
  const v=convs[to.id]||(convs[to.id]={un:0});v.last=data;if(peer&&peer.id===to.id){addMsg(data);scrollEnd()}renderList();
}
async function sendTxt(){const i=$('#txt'),x=i.value.trim();if(!x)return;i.value='';try{await send({kind:'text',body:x})}catch(e){i.value=x;toast('Message nahi gaya')}}
async function up(b,t){
  t=(t||b.type||'application/octet-stream').split(';')[0];const ext=(t.split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'')||'bin',path=me.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const{error}=await sb.storage.from('media').upload(path,b,{contentType:t});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
async function sendFile(e){
  const f=e.target.files[0],to=peer;e.target.value='';if(!f||!to)return;
  if(f.size>19*1048576)return toast('File 19 MB se choti honi chahiye');
  try{toast('Bhej rahe hain...',1);await send({kind:f.type.startsWith('video')?'video':'image',media_url:await up(f)},to);toast('')}catch(x){toast('Upload nahi ho saka')}
}
async function micToggle(){
  if(rec){rec.stop();return}
  const to=peer;if(!to)return;
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const r=rec=new MediaRecorder(st);
    r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    r.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());$('#mic').classList.remove('rec');rec=null;
      const mt=(r.mimeType||'audio/webm').split(';')[0],blob=new Blob(chunks,{type:mt});if(blob.size<1000)return toast('');
      try{toast('Voice bhej rahe hain...',1);await send({kind:'audio',media_url:await up(blob,mt)},to);toast('')}catch(e){toast('Voice nahi gayi')}
    };
    r.start();$('#mic').classList.add('rec');toast('Record ho raha hai, dobara mic dabayein',1);
  }catch(e){rec=null;toast('Mic ki ijazat nahi mili')}
}
function sigTo(id,p){
  return new Promise(res=>{
    let c=outCh[id];const go=()=>{c.send({type:'broadcast',event:'sig',payload:{...p,from:me.id,name:me.username}}).then(res).catch(res)};
    if(!c){c=outCh[id]=sb.channel('call:'+id);c.subscribe(s=>{if(s==='SUBSCRIBED')go()});setTimeout(res,6000)}else go();
  });
}
function gathered(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();const f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);r()}};p.addEventListener('icegatheringstatechange',f);setTimeout(r,4000)})}
async function media(v){ls=await navigator.mediaDevices.getUserMedia({audio:true,video:v?{facingMode:'user'}:false});$('#lv').srcObject=ls;$('#lv').hidden=!v}
function mk(){
  const p=pc=new RTCPeerConnection(ICE);
  p.ontrack=e=>{const r=$('#rv');r.srcObject=e.streams[0];r.play().catch(()=>{});$('#cs').textContent='Connected'};
  p.onconnectionstatechange=()=>{if(p!==pc)return;const s=p.connectionState;
    if(s==='failed'||s==='closed'){toast('Call khatam');endCall(true)}else if(s==='disconnected')$('#cs').textContent='Reconnecting...';else if(s==='connected')$('#cs').textContent='Connected'};
  ls.getTracks().forEach(t=>p.addTrack(t,ls));
}
function showCall(n,s){$('#cn').textContent='@'+n;$('#cs').textContent=s;$('#mu').textContent='🎙️';$('#call').hidden=false}
async function startCall(v){
  const to=peer;if(!to||cpeer||incoming)return;cpeer=to.id;
  try{
    showCall(to.username,'Calling...');await media(v);mk();callId=me.id.slice(0,6)+Date.now();
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
    await sigTo(to.id,{t:'offer',id:callId,v:v?1:0,sdp:pc.localDescription.sdp});
    $('#cs').textContent='Ringing...';ringT=setTimeout(()=>{if(pc&&pc.connectionState!=='connected'){toast('Jawab nahi mila');endCall(true)}},45000);
  }catch(e){toast('Call nahi lag saki. Camera/mic ki ijazat check karein');endCall(false)}
}
function showIncoming(d){
  incoming=d;notify('@'+d.name,d.v?'Video call aa rahi hai':'Voice call aa rahi hai');$('#in').textContent='@'+d.name;$('#it').textContent=d.v?'Incoming video call':'Incoming voice call';$('#inc').hidden=false;
  clearTimeout(ringT);ringT=setTimeout(()=>{if(incoming&&!pc)endCall(false)},45000);
}
async function accept(){
  const d=incoming;if(!d)return;clearTimeout(ringT);$('#inc').hidden=true;cpeer=d.from;callId=d.id;
  try{
    showCall(d.name,'Connecting...');await media(!!d.v);mk();
    await pc.setRemoteDescription({type:'offer',sdp:d.sdp});
    await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    await sigTo(d.from,{t:'answer',id:d.id,sdp:pc.localDescription.sdp});
  }catch(e){toast('Call connect nahi hui');endCall(true)}
}
function endCall(n){
  const o=cpeer||(incoming&&incoming.from),id=callId||(incoming&&incoming.id);
  if(n&&o&&id&&me)sigTo(o,{t:'end',id});
  clearTimeout(ringT);if(pc){const p=pc;pc=null;p.close()}
  if(ls)ls.getTracks().forEach(t=>t.stop());ls=null;callId=cpeer=incoming=null;
  $('#rv').srcObject=null;$('#lv').srcObject=null;$('#call').hidden=true;$('#inc').hidden=true;
}
function onSig(p){
  if(!p||!p.id||p.from===me.id)return;
  if(p.t==='end'){if(p.id===callId||(incoming&&incoming.id===p.id)){toast('Call khatam');endCall(false)}}
  else if(p.t==='offer'){if(!pc&&!incoming&&!cpeer)showIncoming(p);else sigTo(p.from,{t:'end',id:p.id})}
  else if(p.t==='answer'&&p.id===callId&&pc&&!pc.currentRemoteDescription)pc.setRemoteDescription({type:'answer',sdp:p.sdp}).catch(()=>endCall(true));
}
$('#tIn').onclick=()=>setMode('in');$('#tUp').onclick=()=>setMode('up');$('#go').onclick=auth;
$('#u').onkeydown=$('#p').onkeydown=e=>{if(e.key==='Enter')auth()};
$('#out').onclick=logout;$('#bell').onclick=askNotif;$('#addBt').onclick=addUser;$('#addIn').onkeydown=e=>{if(e.key==='Enter')addUser()};
$('#back').onclick=()=>$('#app').classList.remove('open');
$('#snd').onclick=sendTxt;$('#txt').onkeydown=e=>{if(e.key==='Enter')sendTxt()};
$('#att').onclick=()=>$('#file').click();$('#file').onchange=sendFile;$('#mic').onclick=micToggle;
$('#cv').onclick=()=>startCall(false);$('#cx').onclick=()=>startCall(true);
$('#hu').onclick=()=>endCall(true);$('#dc').onclick=()=>endCall(true);$('#ac').onclick=accept;
$('#mu').onclick=()=>{if(!ls)return;const a=ls.getAudioTracks(),en=a[0]?!a[0].enabled:true;a.forEach(t=>t.enabled=en);$('#mu').textContent=en?'🎙️':'🔇'};
document.addEventListener('click',()=>{try{actx=actx||new AudioContext();actx.resume()}catch(e){}},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&peer&&me)markRead(peer.id)});
(async()=>{
  try{const{data:{session}}=await sb.auth.getSession();if(session){await enter(session.user);return}}catch(e){}
  $('#boot').hidden=true;$('#auth').hidden=false;
})();
</script></body></html>
